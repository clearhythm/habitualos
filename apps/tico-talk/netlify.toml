# =============================================================================
# Netlify Configuration for tico-talk
# Set "Package directory" to "apps/tico-talk" in Netlify UI.
# =============================================================================
[build]
  base = "apps/tico-talk"
  ignore = "! git diff-tree --no-commit-id -r --name-only $COMMIT_REF | grep -E '^(apps/tico-talk|packages/edge-functions)/' | grep -c ."
  command = "cd $(git rev-parse --show-toplevel) && pnpm install && mkdir -p apps/tico-talk/netlify/edge-functions/_lib && cp packages/edge-functions/chat-stream-core.ts apps/tico-talk/netlify/edge-functions/_lib/ && pnpm --filter tico-talk build"
  publish = "_site"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[dev]
  framework = "#custom"
  command = "pnpm --filter tico-talk run eleventy:serve"
  targetPort = 8081
  port = 8890
  autoLaunch = false
  functions = "netlify/functions"
  publish = "_site"
  edge_functions = "netlify/edge-functions"

# =============================================================================
# Node.js Functions
# =============================================================================

[functions]
  node_bundler = "esbuild"

# =============================================================================
# Edge Functions
# =============================================================================

[[edge_functions]]
  path = "/api/chat-stream"
  function = "chat-stream"

[[edge_functions]]
  path = "/*"
  function = "auth"

# =============================================================================
# Redirects
# =============================================================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Food/Drinks merged into one /menu/ page with an in-page toggle — these
# stay as permanent routes rather than 404ing for anyone who bookmarked
# or typed the old nested URLs.
[[redirects]]
  from = "/menu/food/"
  to = "/menu/"
  status = 301

[[redirects]]
  from = "/menu/drinks/"
  to = "/menu/"
  status = 301
