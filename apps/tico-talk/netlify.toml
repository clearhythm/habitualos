# =============================================================================
# Netlify Configuration for tico-talk
# Set "Package directory" to "apps/tico-talk" in Netlify UI.
# =============================================================================
[build]
  base = "apps/tico-talk"
  ignore = "! git diff-tree --no-commit-id -r --name-only $COMMIT_REF | grep -E '^(apps/tico-talk|packages/edge-functions)/' | grep -c ."
  command = "cd $(git rev-parse --show-toplevel) && pnpm install && mkdir -p apps/tico-talk/netlify/edge-functions/_lib && cp packages/edge-functions/chat-stream-core.ts apps/tico-talk/netlify/edge-functions/_lib/ && pnpm --filter tico-talk build"
  publish = "_site"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[dev]
  framework = "#custom"
  command = "pnpm --filter tico-talk run eleventy:serve"
  targetPort = 8081
  port = 8890
  autoLaunch = false
  functions = "netlify/functions"
  publish = "_site"
  edge_functions = "netlify/edge-functions"

# =============================================================================
# Node.js Functions
# =============================================================================

[functions]
  node_bundler = "esbuild"

# =============================================================================
# Edge Functions
# =============================================================================

[[edge_functions]]
  path = "/api/chat-stream"
  function = "chat-stream"

[[edge_functions]]
  path = "/*"
  function = "auth"

# =============================================================================
# Redirects
# =============================================================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# /menu/food/, /menu/drinks/, and /menu/food/{category} (etc.) are real,
# independently-visitable routes but not separate pages — status 200 is a
# silent rewrite (unlike a 301, the browser's URL bar keeps showing the
# route actually requested), so they all serve the exact same /menu/ file
# with no duplication. The wildcard covers both the bare content-type
# path and any category segment after it. The page script reads
# location.pathname to pick the right content type (and, if a category
# segment is present, jump straight to that category's teach screen) on
# a direct visit; navigation after that is pure client-side filtering +
# pushState, no further server round-trip.
[[redirects]]
  from = "/menu/food/*"
  to = "/menu/"
  status = 200
  force = true

[[redirects]]
  from = "/menu/drinks/*"
  to = "/menu/"
  status = 200
  force = true